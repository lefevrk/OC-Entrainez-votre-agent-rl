site_name: Entraînez votre agent RL
site_description: Entraînement d'un agent d'apprentissage par renforcement.
site_author: LEFEVRE Kilian
site_url: https://lefevrk.github.io/OC-Entrainez-votre-agent-rl/
repo_url: https://github.com/lefevrk/OC-Entrainez-votre-agent-rl
repo_name: lefevrk/OC-Entrainez-votre-agent-rl

hooks:
  - hooks.py

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Passer en mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Suivre le réglage du système

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      custom_templates: templates
      locale: fr
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: google
            docstring_section_style: table
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Accueil: index.md
  - Démarrage: getting-started.md
  - Référence:
      - Configuration: reference/config.md
  - Décisions: decisions.md
  - Conventions: conventions.md
